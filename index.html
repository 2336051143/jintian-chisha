<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>今天吃啥</title>
  <meta name="description" content="今天吃啥：从一百多道中餐里抽一份午饭，并看看今天的天气、时间和运势。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>" />
  <style>
    /* 站酷快乐体，本地托管，圆圆的可爱字 */
    @font-face {
      font-family: "KuaiLe";
      src: url("fonts/zcool-kuaile.woff2") format("woff2"),
           url("fonts/ZCOOLKuaiLe-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ink: #7a4560;
      --ink-deep: #5c3048;
      --soft: #b57b93;
      --pink: #ff7eae;
      --pink-deep: #ff4d8d;
      --blush: #fff0f6;
      --card: rgba(255, 255, 255, 0.8);
      --line: rgba(255, 186, 210, 0.55);
      --shadow: 0 14px 34px rgba(255, 143, 180, 0.16);
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink-deep);
      font-family: "KuaiLe", "幼圆", "YouYuan", "Segoe UI Emoji", "Microsoft YaHei", sans-serif;
      background-color: #fff4f8;
      background-image:
        radial-gradient(circle at 8% 12%, rgba(255, 186, 214, 0.7), transparent 26%),
        radial-gradient(circle at 92% 8%, rgba(210, 190, 255, 0.62), transparent 24%),
        radial-gradient(circle at 86% 86%, rgba(255, 214, 186, 0.7), transparent 28%),
        radial-gradient(circle at 6% 88%, rgba(186, 240, 216, 0.55), transparent 24%),
        radial-gradient(rgba(255, 171, 198, 0.35) 1.3px, transparent 1.4px);
      background-size: auto, auto, auto, auto, 22px 22px;
      background-attachment: fixed;
    }

    button, input { font-family: inherit; }

    ::selection { background: #ffd3e6; color: #6a3048; }

    .floats {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floats span {
      position: absolute;
      left: var(--x);
      top: var(--y);
      font-size: var(--s, 26px);
      opacity: 0.85;
      animation: floaty 7.5s ease-in-out infinite;
      animation-delay: var(--d, 0s);
      filter: drop-shadow(0 8px 8px rgba(255, 150, 180, 0.25));
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-18px) rotate(8deg); }
    }

    .stage {
      position: relative;
      z-index: 1;
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .hero { text-align: center; padding: 8px 12px 4px; }

    .eyebrow {
      display: inline-block;
      margin: 0;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #e25b8c;
      letter-spacing: 0.14em;
      box-shadow: 0 6px 16px rgba(255, 160, 190, 0.16);
    }

    h1 {
      margin: 10px 0 6px;
      font-size: clamp(52px, 8vw, 86px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: 0.12em;
      color: #ff5f97;
      text-shadow: 0 2px 0 #fff, 0 5px 0 #ffd6e7, 0 12px 22px rgba(255, 110, 160, 0.28);
    }

    h1 i {
      font-style: normal;
      font-size: 0.46em;
      letter-spacing: 0;
      margin: 0 6px;
      vertical-align: 12px;
    }

    .sub {
      margin: 0;
      color: var(--soft);
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    .info {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 0.9fr 1.05fr 1.15fr;
      gap: 14px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: 26px;
      border: 2px solid rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow), inset 0 0 0 1px var(--line);
      padding: 16px 16px 14px;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 90px;
      height: 18px;
      right: 18px;
      top: -6px;
      transform: rotate(8deg);
      border-radius: 4px;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,.45) 0 8px, transparent 8px 12px),
                  linear-gradient(90deg, #ffd0e4, #e6d8ff);
      opacity: 0.95;
    }

    .kicker {
      display: inline-flex;
      margin: 0 0 8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--blush);
      color: #e25b8c;
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    .clock {
      margin: 2px 0 4px;
      font-size: clamp(32px, 4vw, 44px);
      letter-spacing: 0.06em;
      color: #ff5f97;
      font-variant-numeric: tabular-nums;
    }

    .date-line {
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 18px;
    }

    .date-line span:last-child {
      background: #fff4d8;
      color: #d4893a;
      border-radius: 999px;
      padding: 2px 10px;
    }

    .greet, .w-whisper, .fortune-line, .yi, .w-meta, .dish-tip, .times {
      margin: 8px 0 0;
      color: var(--soft);
      line-height: 1.55;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .w-emoji { font-size: 48px; line-height: 1; }

    .temp {
      margin: 0;
      font-size: 40px;
      line-height: 1;
      color: #ff5f97;
    }

    .w-desc { margin: 4px 0 0; font-size: 18px; }

    .city-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-top: 10px;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: #ffb7d0 transparent;
    }

    .city-row::-webkit-scrollbar { height: 7px; }
    .city-row::-webkit-scrollbar-thumb { background: #ffb3d0; border-radius: 99px; }
    .city-row::-webkit-scrollbar-track { background: transparent; }

    .city-row button {
      flex: 0 0 auto;
      border: 0;
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px #ffd3e4;
    }

    .city-row button.active {
      background: linear-gradient(180deg, #ffb0d0, #ff6fa3);
      color: white;
      box-shadow: none;
    }

    .fortune-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .level {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      padding: 4px 10px;
      border-radius: 999px;
      color: white;
      background: linear-gradient(180deg, #ffb35c, #ff7a9a);
      letter-spacing: 0.12em;
    }

    .level.lv-5 { background: linear-gradient(180deg, #ffd56a, #ff6f9f); }
    .level.lv-4 { background: linear-gradient(180deg, #d7c4ff, #ff8fb8); }
    .level.lv-3 { background: linear-gradient(180deg, #9ee0c2, #7ec8f0); }
    .level.lv-2 { background: linear-gradient(180deg, #ffc7a3, #f0a0b8); }

    .stars { color: #ffb03a; letter-spacing: 0.08em; font-size: 18px; }

    .fortune-card h3 {
      margin: 8px 0 0;
      font-size: 26px;
      font-weight: 400;
      color: #ff5f97;
    }

    .lucky {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .lucky span {
      background: #fff;
      border-radius: 999px;
      padding: 4px 10px;
      box-shadow: inset 0 0 0 1px #ffe0ec;
    }

    #luckyDot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin: 0 4px 0 2px;
      vertical-align: -1px;
      box-shadow: 0 0 0 2px white, 0 0 0 3px rgba(255, 160, 190, 0.4);
    }

    .bento {
      margin-top: 14px;
      padding: 16px;
      border-radius: 36px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,250,252,.9)) padding-box,
        linear-gradient(120deg, #ffb7d4, #e4d4ff, #ffd7b8, #ffb7d4) border-box;
      border: 3px solid transparent;
      box-shadow: 0 18px 40px rgba(255, 150, 180, 0.18);
    }

    .bento-inner {
      border: 2px dashed rgba(255, 150, 186, 0.55);
      border-radius: 28px;
      padding: 16px 16px 18px;
      background:
        radial-gradient(circle at 0 0, rgba(255, 228, 240, 0.7), transparent 32%),
        radial-gradient(circle at 100% 100%, rgba(232, 224, 255, 0.65), transparent 28%);
    }

    .bento-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .draw-layout {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 18px;
      align-items: center;
    }

    .machine { width: 230px; margin: 0 auto; }

    .dome {
      position: relative;
      height: 168px;
      border-radius: 120px 120px 26px 26px;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,.96), rgba(255,255,255,.2) 28%, rgba(190, 214, 255, .38) 72%);
      border: 4px solid #fff;
      box-shadow: inset 0 -18px 24px rgba(255, 170, 200, 0.35), 0 10px 0 #ffc6dc;
    }

    .shine {
      position: absolute;
      width: 46px;
      height: 70px;
      left: 28px;
      top: 18px;
      border-radius: 40px;
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,0));
      transform: rotate(18deg);
    }

    .ball {
      position: absolute;
      left: var(--bx);
      top: var(--by);
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      font-size: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #ffe4f0 70%);
      box-shadow: inset 0 -6px 0 rgba(255, 170, 196, 0.35), 0 6px 0 rgba(255, 150, 180, 0.18);
    }

    .machine-body {
      height: 70px;
      margin-top: -2px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 0 0 22px 22px;
      color: white;
      letter-spacing: 0.12em;
      background: linear-gradient(180deg, #ff97c0, #ff5c96);
      box-shadow: 0 8px 0 #e94b82;
    }

    .knob {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #fff, #ffd1e4 40%, #ff8fba 72%);
      box-shadow: 0 4px 0 #e2558c, inset 0 0 0 4px rgba(255,255,255,.45);
    }

    .machine.spin { animation: wobble 0.32s linear infinite; }
    .machine.spin .ball { animation: tumble 0.42s linear infinite; }
    .machine.spin .knob { animation: twist 0.28s linear infinite; }

    @keyframes wobble {
      25% { transform: rotate(-1.6deg); }
      75% { transform: rotate(1.6deg); }
    }

    @keyframes tumble {
      50% { transform: translateY(10px) rotate(16deg); }
    }

    @keyframes twist {
      50% { transform: rotate(40deg); }
    }

    .tray {
      margin-top: 12px;
      min-height: 72px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.72);
      border: 2px dashed #ffc2d8;
    }

    .capsule {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      font-size: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #ffe7f1);
      box-shadow: 0 8px 0 rgba(255, 170, 196, 0.28);
    }

    .result { position: relative; padding: 8px 108px 8px 8px; }

    .stamp {
      position: absolute;
      right: 8px;
      top: 12px;
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 3px solid rgba(255, 93, 143, 0.85);
      color: #ff5d8f;
      letter-spacing: 0.12em;
      transform: rotate(14deg);
      opacity: 0;
      pointer-events: none;
    }

    .stamp.show { animation: stampIn 0.38s cubic-bezier(.2, 1.4, .4, 1) both; }

    @keyframes stampIn {
      0% { opacity: 0; transform: rotate(14deg) scale(1.4); }
      100% { opacity: 0.9; transform: rotate(14deg) scale(1); }
    }

    .dish-tag {
      display: inline-flex;
      margin: 0;
      padding: 3px 10px;
      border-radius: 999px;
      background: #ffe4ef;
      color: #e25b8c;
    }

    .dish-tag[data-tag="川味"] { background: #ffe0e8; color: #d43262; }
    .dish-tag[data-tag="粤式"] { background: #e7f7ef; color: #2f9d74; }
    .dish-tag[data-tag="湘味"] { background: #ffe8d8; color: #e06a2c; }
    .dish-tag[data-tag="江浙"] { background: #e5f4ff; color: #3a86c2; }
    .dish-tag[data-tag="东北"] { background: #fff1d6; color: #d4892a; }
    .dish-tag[data-tag="西北"] { background: #f8ead8; color: #b86b32; }
    .dish-tag[data-tag="云贵"] { background: #e9f8e4; color: #4c9a48; }
    .dish-tag[data-tag="闽南"] { background: #e4f7fb; color: #1f8eab; }
    .dish-tag[data-tag="面点"] { background: #fff4d8; color: #d49a22; }
    .dish-tag[data-tag="汤粥"] { background: #e8fbf6; color: #1aa58a; }
    .dish-tag[data-tag="海鲜"] { background: #e5f2ff; color: #3d7ed0; }
    .dish-tag[data-tag="凉菜"] { background: #eafbe8; color: #4ea24a; }
    .dish-tag[data-tag="盖饭"] { background: #fff0e0; color: #e07a32; }
    .dish-tag[data-tag="点心"] { background: #fde8f4; color: #d45298; }

    h2#dishName {
      margin: 8px 0 0;
      font-size: clamp(32px, 4vw, 52px);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 1.2;
      color: #ff4f90;
    }

    .result.pop h2#dishName { animation: pop 0.45s cubic-bezier(.2, 1.4, .4, 1); }

    @keyframes pop {
      0% { transform: scale(0.86); }
      100% { transform: scale(1); }
    }

    .draw-btn {
      appearance: none;
      margin-top: 16px;
      width: min(100%, 420px);
      border: 0;
      cursor: pointer;
      color: white;
      font-size: 24px;
      letter-spacing: 0.14em;
      padding: 14px 28px 16px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffb7d6 0%, #ff78ad 46%, #ff4d8d 100%);
      box-shadow: 0 7px 0 #e43778, 0 16px 24px rgba(255, 77, 141, 0.28);
      text-shadow: 0 2px 0 rgba(190, 40, 90, 0.25);
    }

    .draw-btn:hover { transform: translateY(-2px); }
    .draw-btn:active { transform: translateY(6px); box-shadow: 0 1px 0 #e43778; }
    .draw-btn:disabled { cursor: wait; filter: saturate(0.85); transform: none; }
    .draw-btn:focus-visible { outline: 3px solid #ffd0e6; outline-offset: 3px; }

    .jar {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.74);
      border-radius: 24px;
      padding: 12px 14px 14px;
      box-shadow: var(--shadow);
    }

    .jar summary {
      cursor: pointer;
      list-style: none;
      color: #e25b8c;
      letter-spacing: 0.06em;
      font-size: 18px;
    }

    .jar summary::-webkit-details-marker { display: none; }
    .jar summary em { font-style: normal; color: var(--soft); font-size: 15px; margin-left: 8px; }

    .jar-tools { margin: 12px 0; }

    #jarSearch {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: #fff;
      color: var(--ink-deep);
      box-shadow: inset 0 0 0 2px #ffd5e6;
      outline: none;
    }

    #jarSearch:focus { box-shadow: inset 0 0 0 2px #ff8fb8; }

    .jar-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 240px;
      overflow: auto;
      padding-right: 4px;
    }

    .pill {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff7fb;
      color: var(--ink);
      box-shadow: inset 0 0 0 1px #ffd8e8;
    }

    .pill:hover { background: #ffe4f0; }

    .foot {
      text-align: center;
      color: #c08aa0;
      margin: 18px 0 0;
      letter-spacing: 0.08em;
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .meteors, .balloons, .pop-fx {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .meteors { z-index: 3; }
    .balloons { z-index: 4; }
    .pop-fx { z-index: 6; }

    .meteor {
      position: absolute;
      width: var(--len, 150px);
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255, 246, 251, 0.2) 35%, #fff 100%);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.85);
      animation: shoot var(--time, 2.1s) linear forwards;
    }

    .meteor::after {
      content: "";
      position: absolute;
      right: -2px;
      top: -3px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px 4px rgba(255, 236, 246, 0.95);
    }

    @keyframes shoot {
      0% { opacity: 0; transform: translate3d(0, 0, 0) rotate(var(--angle, 28deg)); }
      14% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(-72vw, 58vh, 0) rotate(var(--angle, 28deg)); }
    }

    .balloon {
      position: fixed;
      left: var(--x);
      top: 0;
      width: var(--size, 64px);
      height: calc(var(--size, 64px) * 1.45);
      padding: 0;
      border: 0;
      background: transparent;
      pointer-events: auto;
      cursor: pointer;
      animation: rise var(--dur, 28s) linear forwards;
      animation-delay: var(--delay, 0s);
      filter: drop-shadow(0 12px 14px rgba(255, 170, 196, 0.28));
    }

    .balloon-body {
      display: block;
      width: 100%;
      height: 72%;
      border-radius: 50% 50% 46% 46%;
      background:
        radial-gradient(circle at 32% 26%, rgba(255,255,255,.95), transparent 26%),
        linear-gradient(180deg, var(--c1), var(--c2));
      animation: sway 4.2s ease-in-out infinite;
    }

    .balloon-knot {
      display: block;
      width: 10px;
      height: 8px;
      margin: -2px auto 0;
      background: var(--c2);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
    }

    .balloon-string {
      display: block;
      width: 1px;
      height: 22%;
      margin: 0 auto;
      background: linear-gradient(rgba(196, 150, 170, 0.15), rgba(196, 150, 170, 0.55));
    }

    @keyframes rise {
      from { transform: translate3d(0, 108vh, 0); }
      to { transform: translate3d(var(--drift, 16px), -28vh, 0); }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(4deg); }
    }

    .balloon-ghost, .pop-ring, .shard {
      position: fixed;
      pointer-events: none;
    }

    .balloon-ghost {
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 26%, rgba(255,255,255,.95), transparent 26%),
        linear-gradient(180deg, var(--c1), var(--c2));
      animation: ghostPop 0.32s ease-out forwards;
    }

    .pop-ring {
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 4px rgba(255, 196, 220, 0.35);
      animation: ringOut 0.5s ease-out forwards;
    }

    .shard {
      width: 9px;
      height: 12px;
      margin: -6px 0 0 -4px;
      border-radius: 40% 60% 55% 45%;
      animation: shardFly 0.62s ease-out forwards;
    }

    @keyframes ghostPop {
      0% { transform: scale(1); opacity: 0.95; }
      45% { transform: scale(1.28); opacity: 0.7; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    @keyframes ringOut {
      to { transform: scale(4.2); opacity: 0; }
    }

    @keyframes shardFly {
      to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.25); opacity: 0; }
    }

    @media (max-width: 860px) {
      .info, .draw-layout { grid-template-columns: 1fr; }
      .result { padding-right: 8px; }
      .stamp { position: static; margin: 8px 0 0; }
      h1 { letter-spacing: 0.06em; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="meteors" id="meteors" aria-hidden="true"></div>
  <div class="balloons" id="balloons"></div>
  <div class="pop-fx" id="popFx" aria-hidden="true"></div>
  <div class="floats" aria-hidden="true">

    function hashStr(text) {
      let h = 2166136261;
      for (let i = 0; i < text.length; i += 1) {
        h ^= text.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function dateKey(date = new Date()) {
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}-${m}-${d}`;
    }

      if (hour < 14) return "午饭时间到啦，该让肚子开心了";
      if (hour < 17) return "下午如果还空着肚子，现在补上";
      if (hour < 21) return "傍晚了，这一抽也可以当成晚饭";
      return "夜晚轻轻的，吃点暖胃的就好";

    function loadRecipes() {
      const seen = new Set();
      recipes = RAW.split("\n").map((line) => {
        const [name, tag, emoji] = line.split("|");
        return { name: (name || "").trim(), tag: (tag || "家常").trim(), emoji: (emoji || "🍱").trim() };
      }).filter((item) => {
        if (!item.name || seen.has(item.name)) return false;
        seen.add(item.name);
        return true;
      });
      $("jarCountTop").textContent = String(recipes.length);
    }

    function tipOf(recipe) {
      const list = TAG_TIPS[recipe.tag] || TAG_TIPS.家常;

    function whisper(code, temp, feel) {
      const hot = Math.max(temp, feel);
      if (hot >= 30) return "气温有点高，凉菜、清淡和汤都会很舒服";
      if (Math.min(temp, feel) <= 8) return "外面凉凉的，热菜、面和炖汤会更幸福";
      return weatherOf(code)[2];
    }

    async function loadWeather(name, lat, lon) {
      $("wDesc").textContent = "正在看云";
      $("wMeta").textContent = name;
      const cacheKey = `jintian-weather-${name}`;
      try {
        const cached = JSON.parse(sessionStorage.getItem(cacheKey) || "null");
        if (cached && Date.now() - cached.at < 20 * 60 * 1000) {
          paintWeather(cached);
          return;
        }
      } catch (error) { /* 缓存坏了就重新请求 */ }

      const url = new URL("https://api.open-meteo.com/v1/forecast");
      url.searchParams.set("latitude", String(lat));
      url.searchParams.set("longitude", String(lon));
      url.searchParams.set("current", "temperature_2m,apparent_temperature,weather_code");
      url.searchParams.set("timezone", "auto");
      const response = await fetch(url, { signal: AbortSignal.timeout(8000) });
      if (!response.ok) throw new Error("weather");
      const data = await response.json();
      const currentWeather = data.current || {};
      const payload = {
        at: Date.now(),
        name,
        temp: Math.round(currentWeather.temperature_2m),
        feel: Math.round(currentWeather.apparent_temperature),
        code: currentWeather.weather_code
      };
      sessionStorage.setItem(cacheKey, JSON.stringify(payload));
      paintWeather(payload);
    }

    function paintWeather(payload) {
      const info = weatherOf(payload.code);
      $("wEmoji").textContent = info[0] && info[1];
      $("temp").textContent = `${payload.temp}°`;
      $("wDesc").textContent = info[0];
      $("wMeta").textContent = `${payload.name} · 体感 ${payload.feel}°`;
      $("wWhisper").textContent = whisper(payload.code, payload.temp, payload.feel);
      const matched = CITIES.find((city) => String(payload.name).includes(city[0]));
      renderCities(matched ? matched[0] : activeCity);
    }

    async function chooseCity(name, lat, lon) {
      localStorage.setItem("jintian-chisha-city", name);
      renderCities(name);
      try {
        await loadWeather(name, lat, lon);
      } catch (error) {
        showWeatherError();
      }
    }

    function showWeatherError() {
      $("wEmoji").textContent = "🌈";
      $("temp").textContent = "--°";
      $("wDesc").textContent = "天气害羞地躲起来了";
      $("wMeta").textContent = "先在下面点一个城市，午饭照样可以抽";
      $("wWhisper").textContent = location.protocol === "file:" ? "直接打开文件时，天气有时会加载失败。可以改用旁边的启动文件。" : "网络慢一点也没关系。";
    }

    async function bootWeather() {
      renderCities("");
      const saved = localStorage.getItem("jintian-chisha-city");
      const savedCity = CITIES.find((city) => city[0] === saved);
      if (savedCity) {
        try {
          await loadWeather(savedCity[0], savedCity[1], savedCity[2]);
          return;
        } catch (error) { /* 继续尝试自动定位 */ }
      }
      try {
        const response = await fetch("https://get.geojs.io/v1/ip/geo.json", { signal: AbortSignal.timeout(8000) });
        const geo = await response.json();
        const lat = Number(geo.latitude);
        const lon = Number(geo.longitude);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error("geo");
        let name = geo.city || "附近";
        try {
          const rev = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`, { signal: AbortSignal.timeout(8000) });
          const place = await rev.json();
          name = place.city || place.locality || place.principalSubdivision || name;
        } catch (error) { /* 用英文城市名也行 */ }
        await loadWeather(name, lat, lon);
      } catch (error) {
        showWeatherError();
      }
    }

    function resultKey() { return `jintian-chisha-result-${dateKey()}`; }

    function saveResult(recipe) {
      let times = 1;
      try {
        const old = JSON.parse(localStorage.getItem(resultKey()) || "null");
        if (old && old.times) times = old.times + 1;
      } catch (error) { /* 旧记录读不出就从 1 开始 */ }
      localStorage.setItem(resultKey(), JSON.stringify({ name: recipe.name, tag: recipe.tag, emoji: recipe.emoji, times }));
      return times;
    }

    function restoreResult() {
      try {
        const old = JSON.parse(localStorage.getItem(resultKey()) || "null");
        if (!old || !old.name) return;
        const found = recipes.find((item) => item.name === old.name) || old;
        current = found;
        renderDish(found, "result");
        $("times").textContent = `今天第 ${old.times || 1} 次抽签，还热乎着`;
        $("drawBtn").textContent = "再抽一次";
      } catch (error) { /* 没有历史就保持待抽取 */ }
    }

    function pick(exclude) {
      const pool = recipes.filter((item) => item.name !== exclude);
      const source = pool.length ? pool : recipes;
      return source[Math.floor(Math.random() * source.length)];
    }

    function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

    function burst() {
      if (reduceMotion) return;
      const bits = ["✿", "♡", "★", "✨", "🍓", "🎀", "🍑", "💫"];
      for (let i = 0; i < 18; i += 1) {
        const piece = document.createElement("i");
        piece.textContent = bits[i % bits.length];
        piece.style.position = "fixed";
        piece.style.left = `${8 + Math.random() * 84}%`;
        piece.style.top = "42%";
        piece.style.zIndex = "5";
        piece.style.fontStyle = "normal";
        piece.style.pointerEvents = "none";
        piece.style.fontSize = `${16 + Math.random() * 16}px`;
        piece.animate(
          [
            { transform: "translateY(0) scale(1)", opacity: 1 },
            { transform: `translateY(${-120 - Math.random() * 160}px) scale(1.2)`, opacity: 0 }
          ],
          { duration: 900 + Math.random() * 500, easing: "ease-out" }
        );
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 1500);
      }
    }

    async function draw() {
      if (spinning || !recipes.length) return;
      spinning = true;
      const button = $("drawBtn");
      button.disabled = true;
      button.textContent = "翻呀翻…";
      $("machine").classList.add("spin");
      const winner = pick(current && current.name);
      const steps = reduceMotion ? 1 : 26;
      for (let i = 0; i < steps; i += 1) {
        const last = i === steps - 1;
        const shown = last ? winner : recipes[Math.floor(Math.random() * recipes.length)];
        renderDish(shown, last ? "result" : "spin");
        const progress = i / steps;
        await sleep(40 + progress * progress * 280);
      }
      $("machine").classList.remove("spin");
      current = winner;
      const times = saveResult(winner);
      $("times").textContent = `今天第 ${times} 次抽签`;
      $("resultBox").classList.remove("pop");
      void $("resultBox").offsetWidth;
      $("resultBox").classList.add("pop");
      $("live").textContent = `抽到了${winner.name}`;
      burst();
      button.disabled = false;
      button.textContent = "再抽一次";
      spinning = false;
    }

    function renderJar(keyword) {
      const query = (keyword || "").trim();
      const list = recipes.filter((item) => !query || item.name.includes(query) || item.tag.includes(query));
      const box = $("jarList");
      box.innerHTML = "";
      const fragment = document.createDocumentFragment();
      list.forEach((item) => {
        const pill = document.createElement("button");
        pill.type = "button";
        pill.className = "pill";
        pill.textContent = `${item.emoji} ${item.name}`;
        pill.title = item.tag;
        pill.addEventListener("click", () => {
          if (spinning) return;
          current = item;
          renderDish(item, "result");
          const times = saveResult(item);
          $("times").textContent = `今天第 ${times} 次抽签，自己点的也算数`;
          $("drawBtn").textContent = "再抽一次";
          $("live").textContent = `选定了${item.name}`;
          document.querySelector(".bento").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
        });
        fragment.appendChild(pill);
      });
      box.appendChild(fragment);
      $("jarShown").textContent = query ? `找到 ${list.length} 道` : `一共 ${recipes.length} 道`;
    }

    const BALLOON_COLORS = [
      ["#fff7fb", "#ffd4e8"],
      ["#fffaf2", "#ffe4bc"],
      ["#f5fbff", "#d4eeff"],
      ["#f4fff8", "#d5f6e6"],
      ["#f8f5ff", "#e4d8ff"],
      ["#fff7f3", "#ffddd0"]
    ];

    /* 浅色气球从底部缓缓浮出，点一下就破碎 */
    function spawnBalloon(progress) {
      const layer = $("balloons");
      if (!layer || layer.children.length >= 6) return;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "balloon";
      button.setAttribute("aria-label", "点破气球");
      const colors = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
      const dur = 26 + Math.random() * 14;
      button.style.setProperty("--c1", colors[0]);
      button.style.setProperty("--c2", colors[1]);
      button.style.setProperty("--x", `${4 + Math.random() * 88}%`);
      button.style.setProperty("--dur", `${dur}s`);
      button.style.setProperty("--delay", `${progress ? -progress * dur : 0}s`);
      button.style.setProperty("--drift", `${-46 + Math.random() * 92}px`);
      button.style.setProperty("--size", `${54 + Math.random() * 26}px`);
      button.dataset.color = colors[1];
      button.dataset.light = colors[0];
      button.innerHTML = '<span class="balloon-body"></span><span class="balloon-knot"></span><span class="balloon-string"></span>';
      button.addEventListener("click", popBalloon);
      button.addEventListener("animationend", (event) => {
        if (event.animationName !== "rise" || button.dataset.done) return;
        button.dataset.done = "1";
        button.remove();
        spawnBalloon(0);
      });
      layer.appendChild(button);
    }

    function popBalloon(event) {
      event.preventDefault();
      event.stopPropagation();
      const balloon = event.currentTarget;
      if (balloon.dataset.done) return;
      balloon.dataset.done = "1";
      const rect = balloon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height * 0.34;
      const fx = $("popFx");
      const ghost = document.createElement("i");
      ghost.className = "balloon-ghost";
      ghost.style.left = `${rect.left}px`;
      ghost.style.top = `${rect.top}px`;
      ghost.style.width = `${rect.width}px`;
      ghost.style.height = `${rect.width}px`;
      ghost.style.setProperty("--c1", balloon.dataset.light);
      ghost.style.setProperty("--c2", balloon.dataset.color);
      fx.appendChild(ghost);
      const ring = document.createElement("i");
      ring.className = "pop-ring";
      ring.style.left = `${cx}px`;
      ring.style.top = `${cy}px`;
      fx.appendChild(ring);
      const bits = [ghost, ring];
      for (let i = 0; i < 12; i += 1) {
        const shard = document.createElement("i");
        const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.35;
        const dist = 34 + Math.random() * 52;
        shard.className = "shard";
        shard.style.left = `${cx}px`;
        shard.style.top = `${cy}px`;
        shard.style.background = i % 3 === 0 ? "#fff" : balloon.dataset.color;
        shard.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
        shard.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
        shard.style.setProperty("--rot", `${Math.random() * 220 - 110}deg`);
        fx.appendChild(shard);
        bits.push(shard);
      }
      balloon.remove();
      setTimeout(() => bits.forEach((piece) => piece.remove()), 700);
      spawnBalloon(0);
    }

    /* 流星从画面斜向滑过 */
    function spawnMeteor() {
      const layer = $("meteors");
      if (!layer || layer.children.length >= 4) return;
      const star = document.createElement("i");
      star.className = "meteor";
      star.style.left = `${18 + Math.random() * 95}%`;
      star.style.top = `${Math.random() * 46}%`;
      star.style.setProperty("--len", `${110 + Math.random() * 90}px`);
      star.style.setProperty("--angle", `${18 + Math.random() * 22}deg`);
      star.style.setProperty("--time", `${1.5 + Math.random() * 1.3}s`);
      star.addEventListener("animationend", () => star.remove());
      layer.appendChild(star);
    }

    function initSky() {
      if (reduceMotion) return;
      for (let i = 0; i < 5; i += 1) spawnBalloon(0.15 + Math.random() * 0.7);
      spawnMeteor();
      setInterval(() => {
        if (document.hidden) return;
        spawnMeteor();
      }, 1600);
    }

    function init() {
      loadRecipes();
      renderFortune();
      renderClock();
      setInterval(renderClock, 1000);
      restoreResult();
      renderJar("");
      $("drawBtn").addEventListener("click", draw);
      $("jarSearch").addEventListener("input", (event) => renderJar(event.target.value));
      bootWeather();
      initSky();
    }

    init();
  </script>
</body>
</html>
